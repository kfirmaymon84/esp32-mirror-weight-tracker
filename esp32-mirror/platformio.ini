; Smart Mirror Weight Tracker — ESP32 firmware. Toolchain: PlatformIO.
;
; Product builds (one per board variant; hardware profile in src/board.h):
;   e32r40t → 4" LCDWiki E32R40T (ESP32-32E + ST7796S 480x320 + XPT2046)
;   (a 3.5" variant will get its own env + BOARD_* block in board.h)
; Bring-up / test sketches:
;   disp4   → 4" board peripheral test panel (display, touch, speaker, LED, ToF, battery)
;   disp, bringup → legacy 2.8"/1.8" hardware tests (no longer a product target)
;
; Build/flash/monitor the product:
;   pio run -e e32r40t -t upload && pio device monitor -e e32r40t

[platformio]
default_envs = e32r40t

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs: two ~1.9MB app slots (OTA-capable) + a small LittleFS partition.
; (huge_app had a single app slot = no OTA.)
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; ── Product: 4" E32R40T + OKOK broadcast scale ───────────────────────────────
; The Xiaomi S200 driver (mi_scale.*, mi_crypto.*) stays in the tree for
; reference but is not compiled into this build.
[env:e32r40t]
upload_port = COM3
monitor_port = COM3
build_src_filter = +<*> -<bringup.cpp> -<disp_bringup.cpp> -<disp4_bringup.cpp>
    -<mi_scale.cpp> -<mi_crypto.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bodmer/TFT_eSPI@^2.5.43
    pololu/VL53L0X@^1.3.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D BOARD_E32R40T=1
    ; --- TFT_eSPI: ST7796S 320x480 + XPT2046 touch on the shared LCD SPI bus ---
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000

; OTA is done via the on-device web uploader (Settings → Update, browse to the
; shown IP, upload the .bin) — no espota env needed.

; ── New display bring-up: ST7789V 240x320 + XPT2046 touch ───────────────────
[env:disp]
build_src_filter = +<disp_bringup.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_MISO=19
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_OFF=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TOUCH_CS=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D CORE_DEBUG_LEVEL=2

; ── 4" board bring-up: LCDWiki E32R40T (ESP32-32E + ST7796S 320x480 + XPT2046) ─
; All-in-one board on COM3. LCD reset is tied to EN (no GPIO). Touch shares the
; LCD SPI bus (CS=33), so TFT_eSPI TOUCH_CS works like on the 2.8" build.
; Other onboard: RGB LED 22/16/17, SD (VSPI) CS=5, speaker amp IO26, batt ADC IO34,
; I2C header SDA=32 SCL=25, inputs IO35/IO39.
[env:disp4]
upload_port = COM3
monitor_port = COM3
build_src_filter = +<disp4_bringup.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    pololu/VL53L0X@^1.3.1
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7796_DRIVER=1
    -D TFT_WIDTH=320
    -D TFT_HEIGHT=480
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TOUCH_CS=33
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D CORE_DEBUG_LEVEL=2

; ── Hardware bring-up self-test ─────────────────────────────────────────────
[env:bringup]
build_src_filter = +<bringup.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    pololu/VL53L0X@^1.3.1
build_flags =
    ; --- TFT_eSPI setup for ST7735S 128x160 on our pins ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D CORE_DEBUG_LEVEL=2
