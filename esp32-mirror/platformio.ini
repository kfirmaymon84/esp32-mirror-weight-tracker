; Smart Mirror Weight Tracker — ESP32 firmware
; Board: ESP32 DevKit v4 (WROOM-32E). Toolchain: PlatformIO.
;
; Two environments:
;   esp32dev  → the real firmware (BLE reader core; display/etc. added later)
;   bringup   → hardware self-test (TFT + ToF + encoder + buzzer)
;
; Build/upload a specific one:
;   pio run -e bringup -t upload && pio device monitor

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; min_spiffs: two ~1.9MB app slots (OTA-capable) + a small LittleFS partition.
; (huge_app had a single app slot = no OTA.)
board_build.partitions = min_spiffs.csv
board_build.filesystem = littlefs

; ── Real firmware: integrated (BLE + display + ToF + encoder + buzzer) ───────
[env:esp32dev]
build_src_filter = +<*> -<bringup.cpp> -<disp_bringup.cpp>
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
    bodmer/TFT_eSPI@^2.5.43
    pololu/VL53L0X@^1.3.1
    tzapu/WiFiManager@^2.0.17
build_flags =
    -D CORE_DEBUG_LEVEL=2
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    ; --- TFT_eSPI setup for ST7789V 240x320 + XPT2046 touch on our pins ---
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_MISO=19
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_OFF=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TOUCH_CS=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000

; OTA is done via the on-device web uploader (Settings → Update, browse to the
; shown IP, upload the .bin) — no espota env needed.

; ── New display bring-up: ST7789V 240x320 + XPT2046 touch ───────────────────
[env:disp]
build_src_filter = +<disp_bringup.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
build_flags =
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_MISO=19
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_INVERSION_OFF=1
    -D TFT_RGB_ORDER=TFT_BGR
    -D TOUCH_CS=4
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    -D CORE_DEBUG_LEVEL=2

; ── Hardware bring-up self-test ─────────────────────────────────────────────
[env:bringup]
build_src_filter = +<bringup.cpp>
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    pololu/VL53L0X@^1.3.1
build_flags =
    ; --- TFT_eSPI setup for ST7735S 128x160 on our pins ---
    -D USER_SETUP_LOADED=1
    -D ST7735_DRIVER=1
    -D TFT_WIDTH=128
    -D TFT_HEIGHT=160
    -D ST7735_BLACKTAB=1
    -D TFT_MOSI=23
    -D TFT_SCLK=18
    -D TFT_CS=5
    -D TFT_DC=16
    -D TFT_RST=17
    -D TFT_BL=32
    -D TFT_BACKLIGHT_ON=HIGH
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=27000000
    -D CORE_DEBUG_LEVEL=2
